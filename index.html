<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Reflector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Resource Reflector</h1>
    <p class="subtitle">A quiet space for scattered thoughts, links, and files.</p>
  </header>

  <main class="main-content">
    <!-- Capture Form -->
    <section class="form-container">
      <h2>What are we saving?</h2>
      <form id="resourceForm">
        <div class="input-group">
          <input type="text" id="title" placeholder="Give it a title..." required>
        </div>

        <div class="input-group row">
          <select id="type" required>
            <option value="" disabled selected>Select a format</option>
            <option value="link">🔗 Link</option>
            <option value="note">✍️ Thought / Note</option>
            <option value="file">📁 File attachment</option>
          </select>
        </div>

        <div class="input-group">
          <textarea id="content" placeholder="Paste your link, or drop a verified data packet harvested by verify_and_scrape.py here..." rows="3"></textarea>
          <input type="file" id="fileInput" class="hidden">
        </div>

        <div class="input-group">
          <input type="text" id="tags" placeholder="Tags (e.g. inspiration, coding, reading)">
        </div>

        <button type="submit" class="signature-btn">Deposit into memory</button>
      </form>
    </section>

    <!-- Search & Filter Workspace -->
    <section class="search-workspace">
      <div class="search-container">
        <input type="text" id="search" placeholder="Filter through your reflections...">
      </div>
      
      <!-- Resource Cards Container -->
      <div id="resourceList" class="resource-list"></div>
    </section>

    <!-- Data Vault: Offline Backup Panel -->
    <section class="form-container utility-panel">
      <h2>Data Vault</h2>
      <p class="subtitle" style="margin-bottom: 1.25rem;">Safeguard or restore your collected memories locally.</p>
      <div class="utility-actions">
        <button id="exportBtn" class="signature-btn minor-btn">📤 Export Backup (JSON)</button>
        <label for="importFile" class="custom-file-label">📥 Import Backup</label>
        <input type="file" id="importFile" accept=".json" class="hidden">
      </div>
    </section>
  </main>

  <!-- Handmade Footer Signature -->
  <footer class="footer">
    <p>Handcrafted out of personal necessity by Nubaid. Clarity first.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
